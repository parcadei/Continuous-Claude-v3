services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentica-postgres
    environment:
      POSTGRES_USER: agentica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentica_dev}
      POSTGRES_DB: agentica_memory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentica -d agentica_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
